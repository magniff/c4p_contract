name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "sdk[test,tui]"
      - run: python -m pytest sdk/tests -q
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install slither-analyzer
      # fail on anything above the known-benign detectors (timestamp = the chess clock, by design)
      - run: slither . --filter-paths "lib/|test/|script/" --exclude-informational --exclude-optimization --exclude timestamp,divide-before-multiply,uninitialized-state,uninitialized-local --fail-pedantic
