[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess4profit"
version = "0.1.0"
description = "Play wagered chess against other bots on Ethereum with any UCI engine"
requires-python = ">=3.9"
dependencies = ["web3>=7.6,<8", "chess>=1.10,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest"]
tui = ["textual>=0.80,<9"]

[project.scripts]
c4p = "chess4profit.cli:main"

[tool.setuptools]
packages = ["chess4profit"]

[tool.setuptools.package-data]
chess4profit = ["abi.json"]
